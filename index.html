<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAV Digital — Plataforma Comercial Premium de Bienes Raíces & Vehículos</title>

    <!-- Google Fonts Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Inter:wght@300;400;500;600;700;800;900&family=Montserrat:wght@400;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,800;1,400&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">

    <!-- Material Icons & FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --lav-black: #07090e;
            --lav-dark-1: #0e131f;
            --lav-dark-2: #161d2f;
            --lav-dark-3: #212b42;
            --lav-border: #2d3852;
            
            --lav-accent-blue: #3b82f6;
            --lav-accent-indigo: #6366f1;
            --lav-accent-purple: #8b5cf6;
            --lav-accent-gold: #d97706;
            --lav-accent-emerald: #10b981;
            --lav-accent-rose: #f43f5e;

            --lav-text-main: #f8fafc;
            --lav-text-muted: #94a3b8;
            --lav-text-dim: #64748b;

            --lav-glow-primary: rgba(99, 102, 241, 0.25);
            --lav-glass-bg: rgba(14, 19, 31, 0.75);
            --lav-glass-border: rgba(255, 255, 255, 0.08);

            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 18px;
            --radius-xl: 24px;

            --tpl-bg: #0f172a;
            --tpl-card-bg: #1e293b;
            --tpl-primary: #3b82f6;
            --tpl-secondary: #f43f5e;
            --tpl-text: #f8fafc;
            --tpl-text-muted: #94a3b8;
            --tpl-accent: #38bdf8;
            --tpl-font: 'Inter', sans-serif;
            --tpl-radius: 16px;
            --tpl-border: rgba(255, 255, 255, 0.1);
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: var(--lav-black);
            color: var(--lav-text-main);
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
        }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: var(--lav-black); }
        ::-webkit-scrollbar-thumb { background: var(--lav-border); border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: var(--lav-accent-indigo); }

        .app-view { display: none; width: 100%; min-height: 100vh; }
        .app-view.active { display: block; }

        header.lav-header {
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--lav-glass-border);
            position: sticky;
            top: 0;
            z-index: 100;
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .lav-brand {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
        }
        .lav-brand-logo {
            width: 42px;
            height: 42px;
            background: linear-gradient(135deg, var(--lav-accent-indigo), var(--lav-accent-purple));
            border-radius: var(--radius-md);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            color: #fff;
            box-shadow: 0 0 20px var(--lav-glow-primary);
        }
        .lav-brand-text h1 {
            font-size: 1.15rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(to right, #fff, var(--lav-text-muted));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .lav-brand-text span {
            font-size: 0.72rem;
            color: var(--lav-accent-indigo);
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .btn-lav {
            padding: 10px 18px;
            border-radius: var(--radius-md);
            font-size: 0.85rem;
            font-weight: 700;
            cursor: pointer;
            border: 1px solid transparent;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: inline-flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
        }
        .btn-lav-primary {
            background: linear-gradient(135deg, var(--lav-accent-indigo), var(--lav-accent-purple));
            color: #fff;
            box-shadow: 0 4px 14px var(--lav-glow-primary);
        }
        .btn-lav-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 22px rgba(99, 102, 241, 0.45);
        }
        .btn-lav-secondary {
            background: var(--lav-dark-2);
            color: var(--lav-text-main);
            border-color: var(--lav-border);
        }
        .btn-lav-secondary:hover {
            background: var(--lav-dark-3);
            border-color: var(--lav-text-muted);
        }
        .btn-lav-outline {
            background: transparent;
            color: var(--lav-text-main);
            border-color: var(--lav-border);
        }
        .btn-lav-outline:hover {
            border-color: var(--lav-accent-indigo);
            color: var(--lav-accent-indigo);
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 32px 24px;
        }

        .dashboard-header-banner {
            background: linear-gradient(135deg, rgba(22, 29, 47, 0.8), rgba(14, 19, 31, 0.95));
            border: 1px solid var(--lav-glass-border);
            border-radius: var(--radius-xl);
            padding: 36px;
            margin-bottom: 32px;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }
        .dash-title-area h2 {
            font-size: 2.1rem;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.8px;
        }
        .dash-title-area p {
            color: var(--lav-text-muted);
            font-size: 0.98rem;
            max-width: 620px;
        }

        .dash-controls-bar {
            display: grid;
            grid-template-columns: 280px 1fr auto;
            gap: 18px;
            align-items: center;
            margin-bottom: 28px;
            background: var(--lav-dark-1);
            padding: 16px;
            border-radius: var(--radius-lg);
            border: 1px solid var(--lav-border);
        }
        @media (max-width: 900px) {
            .dash-controls-bar { grid-template-columns: 1fr; }
        }

        .select-custom {
            width: 100%;
            padding: 12px 16px;
            background: var(--lav-dark-2);
            border: 1px solid var(--lav-border);
            border-radius: var(--radius-md);
            color: var(--lav-text-main);
            font-weight: 600;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }
        .dash-search-input {
            position: relative;
            width: 100%;
        }
        .dash-search-input i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--lav-text-dim);
        }
        .dash-search-input input {
            width: 100%;
            padding: 12px 16px 12px 42px;
            background: var(--lav-dark-2);
            border: 1px solid var(--lav-border);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
        }

        .cards-inventory-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
            gap: 24px;
        }

        .inventory-card {
            background: var(--lav-dark-1);
            border: 1px solid var(--lav-border);
            border-radius: var(--radius-lg);
            overflow: hidden;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            flex-direction: column;
        }
        .inventory-card:hover {
            transform: translateY(-6px);
            border-color: var(--lav-accent-indigo);
            box-shadow: 0 12px 30px rgba(0,0,0,0.4);
        }
        .inventory-card-hero {
            height: 190px;
            background-size: cover;
            background-position: center;
            position: relative;
        }
        .inventory-card-type-badge {
            position: absolute;
            top: 12px;
            left: 12px;
            background: rgba(7, 9, 14, 0.85);
            backdrop-filter: blur(8px);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--lav-accent-indigo);
            border: 1px solid rgba(255,255,255,0.1);
            text-transform: uppercase;
        }
        .inventory-card-status {
            position: absolute;
            top: 12px;
            right: 12px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.72rem;
            font-weight: 700;
            text-transform: uppercase;
        }
        .status-published { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid #10b981; }
        .status-draft { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid #f59e0b; }

        .inventory-card-body {
            padding: 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .inventory-card-price {
            font-size: 1.5rem;
            font-weight: 900;
            color: var(--lav-accent-indigo);
            margin-bottom: 4px;
        }
        .inventory-card-title {
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 8px;
            line-height: 1.3;
        }
        .inventory-card-client {
            font-size: 0.82rem;
            color: var(--lav-text-muted);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .inventory-card-actions {
            margin-top: auto;
            display: grid;
            grid-template-columns: 1fr 1fr 44px;
            gap: 8px;
            padding-top: 16px;
            border-top: 1px solid var(--lav-border);
        }

        .editor-workspace-layout {
            display: grid;
            grid-template-columns: 560px 1fr;
            min-height: calc(100vh - 71px);
        }
        @media (max-width: 1100px) {
            .editor-workspace-layout { grid-template-columns: 1fr; }
        }

        .editor-controls-sidebar {
            background: var(--lav-dark-1);
            border-right: 1px solid var(--lav-border);
            display: flex;
            flex-direction: column;
            height: calc(100vh - 71px);
            overflow-y: auto;
        }

        .editor-tabs-nav {
            display: flex;
            background: var(--lav-dark-2);
            border-bottom: 1px solid var(--lav-border);
            position: sticky;
            top: 0;
            z-index: 20;
            overflow-x: auto;
        }
        .editor-tab-btn {
            flex: 1;
            padding: 14px 10px;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--lav-text-muted);
            font-size: 0.8rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            transition: all 0.2s;
        }
        .editor-tab-btn i { font-size: 1.1rem; }
        .editor-tab-btn.active {
            color: var(--lav-accent-indigo);
            border-bottom-color: var(--lav-accent-indigo);
            background: rgba(99, 102, 241, 0.08);
        }

        .editor-tab-panel {
            display: none;
            padding: 24px;
        }
        .editor-tab-panel.active { display: block; }

        .form-section-title {
            font-size: 1rem;
            font-weight: 800;
            margin-bottom: 16px;
            padding-bottom: 8px;
            border-bottom: 1px solid var(--lav-border);
            color: var(--lav-text-main);
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .form-group-item {
            margin-bottom: 16px;
        }
        .form-group-item label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--lav-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 6px;
        }
        .form-control-input {
            width: 100%;
            padding: 11px 14px;
            background: var(--lav-dark-2);
            border: 1px solid var(--lav-border);
            border-radius: var(--radius-md);
            color: #fff;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }
        .form-control-input:focus { border-color: var(--lav-accent-indigo); }
        .form-row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }

        .media-dropzone {
            border: 2px dashed var(--lav-border);
            border-radius: var(--radius-lg);
            padding: 24px 16px;
            text-align: center;
            background: rgba(22, 29, 47, 0.5);
            cursor: pointer;
            transition: all 0.25s;
            margin-bottom: 16px;
        }
        .media-dropzone:hover { border-color: var(--lav-accent-indigo); background: rgba(99, 102, 241, 0.05); }
        .media-dropzone i { font-size: 2rem; color: var(--lav-accent-indigo); margin-bottom: 8px; }
        .media-dropzone p { font-size: 0.85rem; font-weight: 700; color: var(--lav-text-main); }
        .media-dropzone span { font-size: 0.75rem; color: var(--lav-text-dim); }

        .gallery-manager-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 10px;
            margin-top: 12px;
        }
        .gallery-item-thumb {
            height: 80px;
            border-radius: var(--radius-md);
            background-size: cover;
            background-position: center;
            border: 1px solid var(--lav-border);
            position: relative;
            overflow: hidden;
        }
        .gallery-item-thumb .btn-del-img {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(244, 63, 94, 0.85);
            color: #fff;
            border: none;
            width: 22px;
            height: 22px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .designs-filter-toolbar {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
            overflow-x: auto;
            padding-bottom: 6px;
        }
        .btn-filter-tag {
            padding: 6px 14px;
            border-radius: 20px;
            background: var(--lav-dark-2);
            border: 1px solid var(--lav-border);
            color: var(--lav-text-muted);
            font-size: 0.78rem;
            font-weight: 700;
            cursor: pointer;
            white-space: nowrap;
        }
        .btn-filter-tag.active {
            background: var(--lav-accent-indigo);
            color: #fff;
            border-color: var(--lav-accent-indigo);
        }

        .designs-catalog-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 12px;
            max-height: 520px;
            overflow-y: auto;
            padding-right: 4px;
        }
        .design-catalog-card {
            background: var(--lav-dark-2);
            border: 2px solid var(--lav-border);
            border-radius: var(--radius-md);
            padding: 10px;
            cursor: pointer;
            transition: all 0.25s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 140px;
        }
        .design-catalog-card:hover { border-color: var(--lav-accent-indigo); transform: translateY(-2px); }
        .design-catalog-card.selected {
            border-color: var(--lav-accent-indigo);
            box-shadow: 0 0 0 3px var(--lav-glow-primary);
            background: rgba(99, 102, 241, 0.12);
        }

        .design-thumb-mini-preview {
            background: #0f172a;
            height: 70px;
            border-radius: 6px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            overflow: hidden;
            position: relative;
        }
        .mini

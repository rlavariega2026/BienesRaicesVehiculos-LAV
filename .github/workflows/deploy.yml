name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lav-digital-hostinger-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate PHP API syntax
        run: php -l card.php && php -l catalog.php && php -l api/manifest.php && php -l api/save-card.php && php -l api/media.php && php -l api/contact.php

      - name: Deploy to verified domain directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: /domains/lavdigitalmkt.com/public_html/bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md
            **/.ftp-deploy-sync-state.json
            data/**
            uploads/**
            storage/**
            publications/**

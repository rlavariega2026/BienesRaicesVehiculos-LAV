name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lav-digital-hostinger-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate PHP API syntax
        run: php -l card.php && php -l catalog.php && php -l api/manifest.php && php -l api/save-card.php && php -l api/media.php && php -l api/contact.php && php -l api/upload-chunk.php && php -l api/auth.php && php -l api/team.php

      - name: Verify administrator setup, login, logout and private inventory protection
        shell: bash
        run: |
          set -euo pipefail
          php -S 127.0.0.1:18765 -t . >/tmp/lav-auth-php.log 2>&1 &
          PHP_PID=$!
          trap 'kill "$PHP_PID" 2>/dev/null || true' EXIT
          for i in {1..20}; do
            if curl -fsS "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-auth-status.json; then break; fi
            sleep 0.2
          done
          php -r '$j=json_decode(file_get_contents("/tmp/lav-auth-status.json"),true); if(!$j || $j["configured"] || $j["authenticated"]) exit(1);'
          PASS="LAV-test-$RANDOM-$RANDOM-very-strong"
          PAYLOAD=$(printf '{"action":"setup","username":"lavariega","password":"%s"}' "$PASS")
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H 'Content-Type: application/json' -d "$PAYLOAD" "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-auth-setup.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-auth-setup.json"),true); if(!$j || !$j["authenticated"] || $j["username"]!=="lavariega") exit(1);'
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H 'Content-Type: application/json' -d '{"action":"logout"}' "http://127.0.0.1:18765/api/auth.php" >/dev/null
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18765/api/save-card.php?action=list")
          test "$HTTP" = "401"
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:18765/api/save-card.php?action=public_list")
          test "$HTTP" = "200"
          PAYLOAD=$(printf '{"action":"login","username":"lavariega","password":"%s"}' "$PASS")
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H 'Content-Type: application/json' -d "$PAYLOAD" "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-auth-login.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-auth-login.json"),true); if(!$j || !$j["authenticated"]) exit(1);'
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie "http://127.0.0.1:18765/api/save-card.php?action=list" >/tmp/lav-auth-list.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-auth-list.json"),true); if(!$j || !$j["success"] || !isset($j["cards"])) exit(1);'
          # Existing admin records must become lavariega without changing passwords.
          php -r '$p="data/cards/admin-auth.json"; $j=json_decode(file_get_contents($p),true); $j["username"]="administrador"; file_put_contents($p,json_encode($j));'
          PAYLOAD=$(printf '{"action":"login","username":"lavariega","password":"%s"}' "$PASS")
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H 'Content-Type: application/json' -d '{"action":"logout"}' "http://127.0.0.1:18765/api/auth.php" >/dev/null
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H 'Content-Type: application/json' -d "$PAYLOAD" "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-auth-migrated.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-auth-migrated.json"),true); if(!$j || !$j["authenticated"] || $j["username"]!=="lavariega") exit(1);'
          php -r '$j=json_decode(file_get_contents("data/cards/admin-auth.json"),true); if(!$j || $j["username"]!=="lavariega") exit(1);'
          # Verify secondary users cannot administer accounts, even with direct API requests.
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-admin-status.json
          CSRF=$(php -r '$j=json_decode(file_get_contents("/tmp/lav-admin-status.json"),true); echo $j["csrf"]??"";')
          test -n "$CSRF"
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H "X-LAV-CSRF: $CSRF" -H 'Content-Type: application/json' -d '{"action":"invite","username":"lavtesteditor","name":"Editor de prueba"}' "http://127.0.0.1:18765/api/team.php" >/tmp/lav-invite.json
          TOKEN=$(php -r '$j=json_decode(file_get_contents("/tmp/lav-invite.json"),true);parse_str((string)parse_url($j["url"],PHP_URL_QUERY),$params);echo $params["invite"]??"";')
          test -n "$TOKEN"
          NEWPASS="LAV-secondary-$RANDOM-$RANDOM-strong"
          DATA=$(printf '{"action":"invite_accept","token":"%s","password":"%s"}' "$TOKEN" "$NEWPASS")
          curl -fsS -c /tmp/lav-editor-cookie -b /tmp/lav-editor-cookie -H 'Content-Type: application/json' -d "$DATA" "http://127.0.0.1:18765/api/auth.php" >/tmp/lav-editor-login.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-editor-login.json"),true);if(!$j || ($j["role"]??"")!=="editor")exit(1);'
          HTTP=$(curl -s -b /tmp/lav-editor-cookie -o /dev/null -w '%{http_code}' "http://127.0.0.1:18765/api/team.php")
          test "$HTTP" = "403"
          HTTP=$(curl -s -b /tmp/lav-editor-cookie -o /dev/null -w '%{http_code}' "http://127.0.0.1:18765/api/save-card.php?action=list")
          test "$HTTP" = "200"
          curl -fsS -c /tmp/lav-auth-cookie -b /tmp/lav-auth-cookie -H "X-LAV-CSRF: $CSRF" -H 'Content-Type: application/json' -d '{"action":"suspend","username":"lavtesteditor"}' "http://127.0.0.1:18765/api/team.php" >/tmp/lav-suspended.json
          HTTP=$(curl -s -b /tmp/lav-editor-cookie -o /dev/null -w '%{http_code}' "http://127.0.0.1:18765/api/save-card.php?action=list")
          test "$HTTP" = "401"
          echo "Team invitations, editor permissions, administrator-only API, session revocation passed."
          echo "Lavariega login, legacy username migration and protected inventory passed."
          rm -f data/cards/admin-auth.json

      - name: Deploy to matched FTP-root directory
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md
            data/**
            uploads/**
            storage/**
            publications/**

      - name: Verify published assets over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lavdigitalmkt.com/bienes-raices-vehiculos"
          for name in index.html app.js public-card-mobile-fix.css demo-publishing.css sw.js; do
            curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "$BASE/$name?verify=${GITHUB_RUN_ID}" -o "/tmp/live-${name}"
            cmp "$name" "/tmp/live-${name}" || { echo "::error::Live $name differs from GitHub checkout"; exit 1; }
            echo "Verified live $name matches repository"
          done
          curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "$BASE/api/auth.php?verify=${GITHUB_RUN_ID}" -o /tmp/lav-live-auth.json
          php -r '$j=json_decode(file_get_contents("/tmp/lav-live-auth.json"),true); if(!$j || empty($j["success"]) || !array_key_exists("configured",$j) || !array_key_exists("authenticated",$j)) exit(1);'
          echo "Verified live administrator authentication endpoint"
          php -r '$j=json_decode(file_get_contents("/tmp/lav-live-auth.json"),true); echo "Live admin configured: ".(!empty($j["configured"])?"yes":"no")."\\n";'
          curl --fail --silent --show-error --max-time 30 "https://lavdigitalmkt.com/assets/logo-lav-digital.png?verify=${GITHUB_RUN_ID}" -o /tmp/lav-real-logo.png
          file /tmp/lav-real-logo.png | grep -q 'PNG image data'
          echo "Verified the actual LAV brand PNG loads over HTTPS"
          curl --fail --silent --show-error --max-time 30 "$BASE/assets/lav-digital-demo-logo.jpg?verify=${GITHUB_RUN_ID}" -o /tmp/lav-actual-demo-logo.jpg
          cmp "assets/lav-digital-demo-logo.jpg" /tmp/lav-actual-demo-logo.jpg || { echo "::error::The DEMO image was not deployed intact"; exit 1; }
          file /tmp/lav-actual-demo-logo.jpg | grep -q 'JPEG image data'
          grep -F 'lav-digital-demo-logo.jpg' demo-overlay.php
          grep -F 'lav-digital-demo-logo.jpg' app.js
          echo "Verified the DEMO image itself exists and matches GitHub on live Hostinger"


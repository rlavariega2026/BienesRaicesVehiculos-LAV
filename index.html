<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAV Digital — Plataforma Comercial Pro</title>
    
    <!-- Tipografías Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Inter:wght@300;400;500;600;700;800;900&family=Outfit:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Iconografía FontAwesome CDN -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --lav-black: #060911;
            --lav-panel: #0f172a;
            --lav-card: #1e293b;
            --lav-border: #334155;
            --lav-primary: #6366f1;
            --lav-primary-hover: #4f46e5;
            --lav-accent: #06b6d4;
            --lav-emerald: #10b981;
            --lav-rose: #f43f5e;
            --lav-amber: #f59e0b;
            --lav-text: #f8fafc;
            --lav-muted: #94a3b8;
            --radius-box: 16px;
            --radius-elem: 10px;

            /* Variables dinámicas para previsualización */
            --tpl-bg: #07090e;
            --tpl-card-bg: #111827;
            --tpl-primary: #06b6d4;
            --tpl-text: #f8fafc;
            --tpl-font: 'Inter', sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body { background-color: var(--lav-black); color: var(--lav-text); font-family: 'Inter', sans-serif; min-height: 100vh; overflow-x: hidden; }

        /* VISTAS DE LA APLICACIÓN */
        .app-view { display: none; width: 100%; min-height: 100vh; }
        .app-view.active { display: block; }

        /* HEADER SUPERIOR */
        header.lav-header {
            background: rgba(15, 23, 42, 0.95);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--lav-border);
            padding: 14px 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .lav-brand { display: flex; align-items: center; gap: 12px; text-decoration: none; cursor: pointer; }
        .brand-logo {
            width: 42px; height: 42px;
            background: linear-gradient(135deg, var(--lav-primary), var(--lav-accent));
            border-radius: var(--radius-elem);
            display: flex; align-items: center; justify-content: center;
            font-size: 20px; color: #fff; box-shadow: 0 0 20px rgba(99, 102, 241, 0.4);
        }
        .brand-text h1 { font-family: 'Outfit', sans-serif; font-size: 1.25rem; font-weight: 900; color: #fff; letter-spacing: -0.5px; }
        .brand-text span { font-size: 0.7rem; color: var(--lav-accent); font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; }

        .btn-lav {
            padding: 10px 18px; border-radius: var(--radius-elem); font-size: 0.85rem; font-weight: 700;
            cursor: pointer; border: 1px solid transparent; transition: all 0.2s; display: inline-flex; align-items: center; gap: 8px; text-decoration: none;
        }
        .btn-primary { background: linear-gradient(135deg, var(--lav-primary), var(--lav-accent)); color: #fff; box-shadow: 0 4px 14px rgba(99,102,241,0.35); }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(99,102,241,0.5); }
        .btn-secondary { background: var(--lav-card); color: var(--lav-text); border-color: var(--lav-border); }
        .btn-secondary:hover { border-color: var(--lav-accent); color: var(--lav-accent); }

        /* VISTA 1: DASHBOARD INVENTARIO */
        .dash-container { max-width: 1400px; margin: 0 auto; padding: 32px 24px; }
        .dash-hero {
            background: linear-gradient(135deg, var(--lav-panel), var(--lav-card));
            border: 1px solid var(--lav-border); border-radius: var(--radius-box);
            padding: 32px; margin-bottom: 28px; display: flex; align-items: center; justify-content: space-between; gap: 20px;
        }
        .dash-hero h2 { font-family: 'Outfit', sans-serif; font-size: 2rem; font-weight: 800; margin-bottom: 6px; }
        .dash-hero p { color: var(--lav-muted); font-size: 0.95rem; }

        .dash-controls {
            display: grid; grid-template-columns: 280px 1fr auto; gap: 16px; margin-bottom: 24px;
            background: var(--lav-panel); padding: 16px; border-radius: var(--radius-box); border: 1px solid var(--lav-border);
        }
        .select-custom, .input-custom {
            width: 100%; padding: 11px 14px; background: var(--lav-card); border: 1px solid var(--lav-border);
            border-radius: var(--radius-elem); color: #fff; font-size: 0.9rem; outline: none;
        }

        .inventory-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 24px; }
        .inv-card {
            background: var(--lav-panel); border: 1px solid var(--lav-border); border-radius: var(--radius-box);
            overflow: hidden; transition: transform 0.25s, border-color 0.25s; display: flex; flex-direction: column;
        }
        .inv-card:hover { transform: translateY(-4px); border-color: var(--lav-primary); box-shadow: 0 12px 30px rgba(0,0,0,0.5); }
        .inv-hero { height: 200px; background-size: cover; background-position: center; position: relative; }
        .inv-badge-type {
            position: absolute; top: 12px; left: 12px; background: rgba(6, 9, 17, 0.85); backdrop-filter: blur(6px);
            padding: 4px 12px; border-radius: 20px; font-size: 0.72rem; font-weight: 800; color: var(--lav-accent); text-transform: uppercase; border: 1px solid rgba(255,255,255,0.1);
        }
        .inv-badge-status {
            position: absolute; top: 12px; right: 12px; padding: 4px 10px; border-radius: 20px; font-size: 0.72rem; font-weight: 700; text-transform: uppercase;
        }
        .status-pub { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--lav-emerald); }
        .status-draft { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid var(--lav-amber); }

        .inv-body { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .inv-price { font-family: 'Outfit', sans-serif; font-size: 1.5rem; font-weight: 900; color: var(--lav-accent); margin-bottom: 4px; }
        .inv-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 8px; line-height: 1.3; }
        .inv-client { font-size: 0.8rem; color: var(--lav-muted); margin-bottom: 16px; display: flex; align-items: center; gap: 6px; }
        .inv-actions { margin-top: auto; display: grid; grid-template-columns: 1fr 1fr 1fr 42px; gap: 6px; padding-top: 14px; border-top: 1px solid var(--lav-border); }

        /* VISTA 2: EDITOR WORKSPACE */
        .workspace-layout { display: grid; grid-template-columns: 540px 1fr; min-height: calc(100vh - 71px); }
        @media(max-width: 1024px) { .workspace-layout { grid-template-columns: 1fr; } }

        .editor-sidebar { background: var(--lav-panel); border-right: 1px solid var(--lav-border); display: flex; flex-direction: column; height: calc(100vh - 71px); overflow-y: auto; }
        .editor-tabs { display: flex; background: var(--lav-black); border-bottom: 1px solid var(--lav-border); position: sticky; top: 0; z-index: 10; }
        .tab-btn {
            flex: 1; padding: 14px 6px; background: transparent; border: none; border-bottom: 3px solid transparent;
            color: var(--lav-muted); font-size: 0.75rem; font-weight: 700; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 4px;
        }
        .tab-btn i { font-size: 1rem; }
        .tab-btn.active { color: var(--lav-accent); border-bottom-color: var(--lav-accent); background: rgba(6, 182, 212, 0.08); }

        .tab-panel { display: none; padding: 24px; }
        .tab-panel.active { display: block; }

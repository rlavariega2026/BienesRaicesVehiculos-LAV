<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAV Digital — Tarjetas Comerciales Pro</title>
    <style>
        :root {
            --bg: #090d16;
            --panel: #111827;
            --card: #1f2937;
            --border: #374151;
            --primary: #4f46e5;
            --accent: #06b6d4;
            --text: #f9fafb;
            --muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); min-height: 100vh; }

        .view { display: none; width: 100%; min-height: 100vh; }
        .view.active { display: block; }

        header { background: var(--panel); border-bottom: 1px solid var(--border); padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 1.2rem; color: var(--accent); }

        .container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .btn { background: var(--primary); color: #fff; border: none; padding: 10px 18px; border-radius: 8px; font-weight: 700; cursor: pointer; }
        .btn:hover { opacity: 0.9; }

        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-item { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
        .card-hero { height: 180px; background-size: cover; background-position: center; }
        .card-body { padding: 16px; }
        .card-price { font-size: 1.4rem; font-weight: 800; color: var(--accent); }
        .card-title { font-size: 1rem; font-weight: 700; margin: 6px 0; }

        .editor-layout { display: grid; grid-template-columns: 450px 1fr; min-height: calc(100vh - 65px); }
        @media(max-width: 900px) { .editor-layout { grid-template-columns: 1fr; } }

        .sidebar { background: var(--panel); border-right: 1px solid var(--border); padding: 20px; height: calc(100vh - 65px); overflow-y: auto; }
        .form-group { margin-bottom: 12px; }
        .form-group label { display: block; font-size: 0.75rem; font-weight: 700; color: var(--muted); text-transform: uppercase; margin-bottom: 4px; }
        .form-control { width: 100%; padding: 10px; background: var(--card); border: 1px solid var(--border); border-radius: 6px; color: #fff; font-size: 0.9rem; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }

        .stage-area { background: #030712; padding: 24px; display: flex; justify-content: center; align-items: flex-start; overflow-y: auto; }
        .phone-frame { width: 380px; min-height: 720px; background: #0f172a; border-radius: 30px; border: 8px solid #1e293b; overflow: hidden; box-shadow: 0 20px 40px rgba(0,0,0,0.8); }

        .preview-card-hero { height: 280px; background-size: cover; background-position: center; position: relative; display: flex; flex-direction: column; justify-content: flex-end; padding: 20px; }
        .preview-card-hero::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to top, #0f172a 10%, transparent 70%); }
    </style>
</head>
<body>

    <header>
        <h1 onclick="goDash()" style="cursor:pointer;">LAV DIGITAL - Plataforma Comercial</h1>
        <button class="btn" onclick="newCard()">+ Nueva Tarjeta</button>
    </header>

    <!-- DASHBOARD -->
    <main id="v-dash" class="view active">
        <div class="container">
            <h2>Inventario de Tarjetas Digitales</h2>
            <div id="inv-grid" class="grid"></div>
        </div>
    </main>

    <!-- EDITOR -->
    <main id="v-edit" class="view">
        <div class="editor-layout">
            <div class="sidebar">
                <h3>Editor de Anuncio</h3>
                <div class="form-group" style="margin-top:14px;">
                    <label>Categoría</label>
                    <select id="e-cat" class="form-control" onchange="preview()">
                        <option value="real_estate">Bienes Raíces</option>
                        <option value="vehicle">Vehículo</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Título Comercial</label>
                    <input type="text" id="e-title" class="form-control" placeholder="Ej. Casa en Cuernavaca" oninput="preview()">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label>Precio ($ MXN)</label>
                        <input type="number" id="e-price" class="form-control" placeholder="3500000" oninput="preview()">
                    </div>
                    <div class="form-group">
                        <label>Ubicación</label>
                        <input type="text" id="e-loc" class="form-control" placeholder="Morelos" oninput="preview()">
                    </div>
                </div>
                <div class="form-group">
                    <label>Foto de Portada (Archivo)</label>
                    <input type="file" class="form-control" accept="image/*" onchange="uploadCover(event)">
                </div>
                <div class="form-group">
                    <label>WhatsApp (Ej. 527771234567)</label>
                    <input type="text" id="e-wa" class="form-control" placeholder="527771234567" oninput="preview()">
                </div>
                <div class="form-group">
                    <label>Descripción</label>
                    <textarea id="e-desc" class="form-control" rows="3" oninput="preview()"></textarea>
                </div>
                <button class="btn" style="width:100%; margin-top:10px;" onclick="savePub()">Guardar y Publicar</button>
            </div>

            <div class="stage-area">
                <div class="phone-frame" id="stage-render"></div>
            </div>
        </div>
    </main>

    <!-- PUBLIC VIEW -->
    <main id="v-pub" class="view">
        <div style="max-width: 420px; margin: 0 auto; min-height: 100vh; background:#0f172a;" id="pub-render"></div>
    </main>

    <script>
        let db = JSON.parse(localStorage.getItem('lav_db')) || [
            { id: 'demo1', title: 'Residencia en Cuernavaca', price: 4500000, loc: 'Cuernavaca, Morelos', cover: 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80', wa: '527771234567', desc: 'Hermosa propiedad con alberca.' }
        ];
        let currentCard = null;
        let tempCover = '';

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const id = urlParams.get('card');
            if (id) {
                renderPublic(id);
            } else {
                goDash();
            }
        });

        function goDash() {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-dash').classList.add('active');
            renderInv();
        }

        function renderInv() {
            const grid = document.getElementById('inv-grid');
            grid.innerHTML = '';
            db.forEach(item => {
                const priceFmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(item.price || 0);
                grid.innerHTML += `
                    <div class="card-item">
                        <div class="card-hero" style="background-image:url('${item.cover || ''}')"></div>
                        <div class="card-body">
                            <div class="card-price">${priceFmt}</div>
                            <div class="card-title">${item.title}</div>
                            <div style="display:flex; gap:8px; margin-top:12px;">
                                <button class="btn" style="padding:6px 12px; font-size:0.8rem;" onclick="edit('${item.id}')">Editar</button>
                                <button class="btn" style="padding:6px 12px; font-size:0.8rem; background:#334155;" onclick="share('${item.id}')">Link</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        function newCard() {
            currentCard = { id: 'c_' + Date.now(), title: '', price: 0, loc: '', cover: '', wa: '', desc: '' };
            tempCover = '';
            loadEditor();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-edit').classList.add('active');
        }

        function edit(id) {
            currentCard = db.find(x => x.id === id);
            if (!currentCard) return;
            tempCover = currentCard.cover || '';
            loadEditor();
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-edit').classList.add('active');
        }

        function loadEditor() {
            document.getElementById('e-title').value = currentCard.title || '';
            document.getElementById('e-price').value = currentCard.price || '';
            document.getElementById('e-loc').value = currentCard.loc || '';
            document.getElementById('e-wa').value = currentCard.wa || '';
            document.getElementById('e-desc').value = currentCard.desc || '';
            preview();
        }

        function uploadCover(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                tempCover = evt.target.result;
                preview();
            };
            reader.readAsDataURL(file);
        }

        function preview() {
            const stage = document.getElementById('stage-render');
            const title = document.getElementById('e-title').value || 'Título de Muestra';
            const price = Number(document.getElementById('e-price').value || 0);
            const priceFmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(price);
            const loc = document.getElementById('e-loc').value || 'Ubicación';
            const desc = document.getElementById('e-desc').value || 'Descripción...';
            const wa = document.getElementById('e-wa').value;
            const cover = tempCover || 'https://images.unsplash.com/photo-1600596542815-ffad4c1539a9?auto=format&fit=crop&w=800&q=80';

            stage.innerHTML = `
                <div class="preview-card-hero" style="background-image:url('${cover}')">
                    <div style="font-size:1.8rem; font-weight:900; color:var(--accent); position:relative; z-index:2;">${priceFmt}</div>
                    <div style="font-size:1.1rem; font-weight:800; position:relative; z-index:2; margin-top:4px;">${title}</div>
                    <div style="font-size:0.8rem; color:#cbd5e1; position:relative; z-index:2; margin-top:4px;">📍 ${loc}</div>
                </div>
                <div style="padding:20px;">
                    <p style="font-size:0.88rem; color:#cbd5e1; line-height:1.5;">${desc}</p>
                    ${wa ? `<a href="https://wa.me/${wa}" target="_blank" style="display:block; background:#25d366; color:#fff; text-align:center; padding:12px; border-radius:8px; font-weight:700; text-decoration:none; margin-top:20px;">💬 Contactar por WhatsApp</a>` : ''}
                </div>
            `;
        }

        function savePub() {
            if (!currentCard) return;
            currentCard.title = document.getElementById('e-title').value;
            currentCard.price = Number(document.getElementById('e-price').value);
            currentCard.loc = document.getElementById('e-loc').value;
            currentCard.wa = document.getElementById('e-wa').value;
            currentCard.desc = document.getElementById('e-desc').value;
            currentCard.cover = tempCover;

            const idx = db.findIndex(x => x.id === currentCard.id);
            if (idx >= 0) db[idx] = currentCard;
            else db.unshift(currentCard);

            localStorage.setItem('lav_db', JSON.stringify(db));
            share(currentCard.id);
        }

        function share(id) {
            const url = window.location.origin + window.location.pathname + `?card=${id}`;
            prompt('¡Tarjeta publicada con éxito! Copia este enlace:', url);
        }

        function renderPublic(id) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            document.getElementById('v-pub').classList.add('active');
            const item = db.find(x => x.id === id) || db[0];
            const priceFmt = new Intl.NumberFormat('es-MX', { style: 'currency', currency: 'MXN' }).format(item.price || 0);

            document.getElementById('pub-render').innerHTML = `
                <div class="preview-card-hero" style="height:350px; background-image:url('${item.cover || ''}')">
                    <div style="font-size:2rem; font-weight:900; color:var(--accent); position:relative; z-index:2;">${priceFmt}</div>
                    <div style="font-size:1.2rem; font-weight:800; position:relative; z-index:2; margin-top:4px;">${item.title}</div>
                    <div style="font-size:0.85rem; color:#cbd5e1; position:relative; z-index:2; margin-top:4px;">📍 ${item.loc}</div>
                </div>
                <div style="padding:24px;">
                    <p style="font-size:0.95rem; color:#cbd5e1; line-height:1.6;">${item.desc || ''}</p>
                    ${item.wa ? `<a href="https://wa.me/${item.wa}" target="_blank" style="display:block; background:#25d366; color:#fff; text-align:center; padding:14px; border-radius:10px; font-weight:700; text-decoration:none; margin-top:24px;">💬 Contactar por WhatsApp</a>` : ''}
                </div>
            `;
        }
    </script>
</body>
</html>

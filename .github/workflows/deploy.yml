name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate PHP API syntax
        run: php -l api/save-card.php && php -l api/auth.php

      # Standard Hostinger account root layout
      - name: Deploy to public_html path
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: public_html/bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md

      # Some Hostinger FTP accounts are already rooted at public_html.
      # Deploy the same files there too so the public URL resolves in either layout.
      - name: Deploy to FTP-root-relative path
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md

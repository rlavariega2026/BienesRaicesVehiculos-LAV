<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bienes Raíces y Vehículos - Tarjetas Digitales LAV</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1d4ed8;
            --slate-900: #0f172a;
            --slate-800: #1e293b;
            --slate-100: #f1f5f9;
            --slate-50: #f8fafc;
            --border: #cbd5e1;
            --radius: 12px;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--slate-50); color: var(--slate-900); line-height: 1.5; }

        #editor-app-container, #public-card-container { width: 100%; min-height: 100vh; }
        #public-card-container { display: none; background: #ffffff; padding: 20px 10px; }

        header { background: var(--slate-900); color: white; padding: 20px; text-align: center; }
        header h1 { font-size: 1.5rem; font-weight: 700; }
        header p { font-size: 0.9rem; color: #94a3b8; margin-top: 4px; }

        .main-layout { max-width: 1280px; margin: 20px auto; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; padding: 0 15px; }
        @media (max-width: 960px) { .main-layout { grid-template-columns: 1fr; } }

        .card-box { background: white; border-radius: var(--radius); border: 1px solid var(--border); padding: 24px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        .card-box h2 { font-size: 1.1rem; margin-bottom: 16px; color: var(--slate-800); border-bottom: 2px solid var(--slate-100); padding-bottom: 8px; }

        .form-group { margin-bottom: 14px; }
        .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--slate-800); }
        .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.9rem; }
        .form-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px; }

        /* Controles de Carga de Fotografías */
        .photo-uploader-box { border: 2px dashed var(--border); padding: 15px; border-radius: 8px; text-align: center; background: var(--slate-50); margin-bottom: 10px; }
        .gallery-preview-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 10px; }
        .gallery-thumb-item { height: 70px; border-radius: 6px; background-size: cover; background-position: center; border: 1px solid var(--border); position: relative; }

        /* Selector de 100 Diseños */
        .designs-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .designs-counter-badge { background: var(--primary); color: white; padding: 4px 10px; border-radius: 20px; font-size: 0.8rem; font-weight: 700; }
        
        #designs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(145px, 1fr));
            gap: 12px;
            max-height: 450px;
            overflow-y: auto;
            padding: 10px;
            background: var(--slate-100);
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .design-thumb-item {
            background: white;
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .design-thumb-item:hover { border-color: var(--primary); transform: translateY(-2px); }
        .design-thumb-item.selected { border-color: var(--primary); background: #eff6ff; box-shadow: 0 0 0 3px rgba(37,99,235,0.2); }
        
        .thumb-top { display: flex; justify-content: space-between; font-size: 10px; color: #64748b; margin-bottom: 4px; }
        .thumb-mock { background: #cbd5e1; height: 45px; border-radius: 4px; margin-bottom: 6px; position: relative; overflow: hidden; }
        .thumb-title { font-size: 11px; font-weight: 700; text-align: center; color: var(--slate-800); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        /* Vista Previa */
        .live-preview-wrapper { background: var(--slate-900); padding: 20px; border-radius: var(--radius); color: white; position: sticky; top: 20px; }
        .card-preview-render { background: white; color: var(--slate-900); border-radius: 10px; overflow: hidden; min-height: 480px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }
        .preview-cover-area { height: 220px; background: #cbd5e1; background-size: cover; background-position: center; position: relative; }
        .preview-content { padding: 18px; }
        .preview-price { font-size: 1.5rem; font-weight: 800; color: var(--primary); margin-bottom: 6px; }
        .preview-title { font-size: 1.15rem; font-weight: 700; margin-bottom: 8px; }

        .btn-action { background: var(--primary); color: white; border: none; width: 100%; padding: 14px; border-radius: 8px; font-size: 1rem; font-weight: 700; cursor: pointer; transition: background 0.2s; }
        .btn-action:hover { background: var(--primary-dark); }

        /* Vista Pública Tarjeta Digital */
        .public-card-container { max-width: 480px; margin: 0 auto; background: white; border-radius: 16px; overflow: hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border: 1px solid var(--border); }
        .public-hero { width: 100%; height: 280px; background-size: cover; background-position: center; }
        .public-body { padding: 24px; }
        .public-price { font-size: 1.8rem; font-weight: 800; color: var(--primary); margin-bottom: 8px; }
        .public-title { font-size: 1.3rem; font-weight: 700; color: var(--slate-900); margin-bottom: 12px; }
        .public-features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; background: var(--slate-50); padding: 12px; border-radius: 8px; margin-bottom: 15px; font-size: 0.85rem; }

        .contact-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 20px; }
        .contact-btn { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 8px; background: var(--slate-100); border-radius: 10px; text-decoration: none; color: var(--slate-900); font-size: 0.75rem; font-weight: 600; gap: 6px; border: 1px solid var(--border); }
        .contact-btn svg { width: 22px; height: 22px; fill: currentColor; }

        #share-modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7); align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-content { background: white; width: 100%; max-width: 400px; padding: 24px; border-radius: var(--radius); text-align: center; }
    </style>
</head>
<body>

    <div id="editor-app-container">
        <header>
            <h1>LAV Digital - Tarjetas Comerciales</h1>
            <p>Bienes Raíces y Vehículos de Alto Impacto Comercial</p>
        </header>

        <div class="main-layout">
            <div class="editor-column">
                
                <!-- SECCIÓN 1: TIPO DE ANUNCIO Y DATOS GENERALES -->
                <div class="card-box">
                    <h2>1. Tipo de Anuncio</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Categoría</label>
                            <select id="ad-type" onchange="toggleCategoryFields()">
                                <option value="real_estate">Inmueble / Propiedad</option>
                                <option value="vehicle">Vehículo / Automóvil</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Operación</label>
                            <select id="ad-operation">
                                <option value="Venta">Venta</option>
                                <option value="Renta">Renta</option>
                                <option value="Traspaso">Traspaso</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>Título Comercial</label>
                        <input type="text" id="inp-title" placeholder="Ej. Casa Residencial en Cuernavaca" oninput="updatePreview()">
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label>Precio ($ MXN)</label>
                            <input type="number" id="inp-price" placeholder="Ej. 2500000" oninput="updatePreview()">
                        </div>
                        <div class="form-group">
                            <label>Ubicación / Ciudad</label>
                            <input type="text" id="inp-location" placeholder="Ej. Cuernavaca, Morelos" oninput="updatePreview()">
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 2: CAMPOS ESPECÍFICOS PARA INMUEBLES -->
                <div class="card-box" id="box-real-estate-fields">
                    <h2>2. Ficha Técnica del Inmueble</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Tipo de Inmueble</label>
                            <select id="re-type">
                                <option value="Casa">Casa</option>
                                <option value="Departamento">Departamento</option>
                                <option value="Terreno">Terreno</option>
                                <option value="Local Comercial">Local Comercial</option>
                                <option value="Oficina">Oficina</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Terreno (m²)</label>
                            <input type="number" id="re-land-area" placeholder="Ej. 250">
                        </div>
                        <div class="form-group">
                            <label>Construcción (m²)</label>
                            <input type="number" id="re-build-area" placeholder="Ej. 180">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Recámaras</label>
                            <input type="number" id="re-bedrooms" placeholder="Ej. 3">
                        </div>
                        <div class="form-group">
                            <label>Baños</label>
                            <input type="number" id="re-bathrooms" placeholder="Ej. 2.5" step="0.5">
                        </div>
                        <div class="form-group">
                            <label>Estacionamientos</label>
                            <input type="number" id="re-parking" placeholder="Ej. 2">
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Amenidades y Características</label>
                        <input type="text" id="re-amenities" placeholder="Ej. Alberca, Seguridad 24/7, Jardín, Cisterna">
                    </div>
                </div>

                <!-- SECCIÓN 3: CAMPOS ESPECÍFICOS PARA VEHÍCULOS -->
                <div class="card-box" id="box-vehicle-fields" style="display: none;">
                    <h2>2. Ficha Técnica del Vehículo</h2>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Marca</label>
                            <input type="text" id="veh-brand" placeholder="Ej. BMW">
                        </div>
                        <div class="form-group">
                            <label>Modelo / Versión</label>
                            <input type="text" id="veh-model" placeholder="Ej. M3 Competition">
                        </div>
                        <div class="form-group">
                            <label>Año</label>
                            <input type="number" id="veh-year" placeholder="Ej. 2022">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Kilometraje (km)</label>
                            <input type="number" id="veh-mileage" placeholder="Ej. 35000">
                        </div>
                        <div class="form-group">
                            <label>Transmisión</label>
                            <select id="veh-transmission">
                                <option value="Automática">Automática</option>
                                <option value="Manual">Manual</option>
                                <option value="DKG / DSG">Dual Clutch / DKG</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>Combustible</label>
                            <select id="veh-fuel">
                                <option value="Gasolina">Gasolina</option>
                                <option value="Híbrido">Híbrido</option>
                                <option value="Eléctrico">Eléctrico</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 4: FOTOGRAFÍA DE PORTADA Y GALERÍA INDEPENDIENTE -->
                <div class="card-box">
                    <h2>3. Fotografías del Anuncio</h2>
                    <div class="form-group">
                        <label>URL de la Fotografía Principal (Portada)</label>
                        <input type="text" id="inp-cover" placeholder="https://..." oninput="updatePreview()">
                    </div>
                    
                    <div class="form-group">
                        <label>Agregar Galería Múltiple (URLs separadas por coma)</label>
                        <textarea id="inp-gallery-urls" rows="2" placeholder="https://foto1.jpg, https://foto2.jpg" oninput="updateGalleryPreview()"></textarea>
                    </div>
                    <div class="gallery-preview-grid" id="gallery-thumb-container"></div>
                </div>

                <!-- SECCIÓN 5: DESCRIPCIÓN Y CONTACTOS -->
                <div class="card-box">
                    <h2>4. Descripción y Contactos</h2>
                    <div class="form-group">
                        <label>Descripción Detallada</label>
                        <textarea id="inp-desc" rows="3" placeholder="Atributos principales..." oninput="updatePreview()"></textarea>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label>WhatsApp</label>
                            <input type="text" id="inp-whatsapp" placeholder="527771234567">
                        </div>
                        <div class="form-group">
                            <label>Teléfono</label>
                            <input type="text" id="inp-phone" placeholder="7771234567">
                        </div>
                        <div class="form-group">
                            <label>Ubicación Maps (URL)</label>
                            <input type="text" id="inp-maps" placeholder="https://maps.google.com/...">
                        </div>
                    </div>
                </div>

                <!-- SECCIÓN 6: SELECTOR REAL DE 100 DISEÑOS -->
                <div class="card-box">
                    <div class="designs-header">
                        <h2>5. Selección de Modelo</h2>
                        <span id="total-designs-counter" class="designs-counter-badge">100</span>
                    </div>
                    <div id="designs-grid"></div>
                </div>

                <button class="btn-action" onclick="saveAndPublishCard()">Guardar y Obtener Enlace Público</button>
            </div>

            <!-- VISTA PREVIA INTERACTIVA -->
            <div class="live-preview-wrapper">
                <h3 style="font-size: 0.85rem; margin-bottom: 12px; color: #94a3b8; text-transform: uppercase;">Vista Previa en Tiempo Real</h3>
                <div class="card-preview-render" id="card-live-preview">
                    <div class="preview-cover-area" id="prev-cover"></div>
                    <div class="preview-content">
                        <div class="preview-price

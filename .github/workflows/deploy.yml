name: Deploy to Hostinger
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lav-digital-hostinger-deploy
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate JavaScript syntax
        run: node --check app.js

      - name: Validate PHP API syntax
        run: php -l card.php && php -l catalog.php && php -l api/manifest.php && php -l api/save-card.php && php -l api/media.php && php -l api/contact.php

      - name: Identify actual web root with a unique HTTP-visible probe
        id: target
        shell: bash
        env:
          FTP_USER: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          TOKEN="lav-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          FILE=".lav-deploy-probe-${GITHUB_RUN_ID}.txt"
          printf '%s' "$TOKEN" >/tmp/lav-probe.txt
          MATCH=""
          for dir in "/public_html/bienes-raices-vehiculos/" "/bienes-raices-vehiculos/"; do
            FTP_URL="ftp://31.170.161.28:21${dir}${FILE}"
            echo "Testing FTP path: $dir"
            if ! curl --fail --silent --show-error --max-time 30 --user "$FTP_USER:$FTP_PASS" --upload-file /tmp/lav-probe.txt "$FTP_URL"; then
              echo "FTP upload unavailable: $dir"
              continue
            fi
            HTTP_URL="https://lavdigitalmkt.com/bienes-raices-vehiculos/${FILE}?run=${GITHUB_RUN_ID}"
            HTTP_BODY=$(curl --fail --silent --show-error --max-time 25 -H 'Cache-Control: no-store' "$HTTP_URL" || true)
            curl --silent --show-error --max-time 20 --user "$FTP_USER:$FTP_PASS" -Q "DELE ${dir}${FILE}" "ftp://31.170.161.28:21/" -o /dev/null || true
            if [ "$HTTP_BODY" = "$TOKEN" ]; then
              MATCH="$dir"
              echo "CONFIRMED LIVE WEB ROOT: $dir"
              break
            fi
            echo "This FTP path is NOT the public website: $dir"
          done
          if [ -z "$MATCH" ]; then
            echo "::error::No FTP path maps to the live URL. Refusing to publish in an unverified directory."
            exit 1
          fi
          if [ "$MATCH" = "/public_html/bienes-raices-vehiculos/" ]; then
            echo "target=public_html" >> "$GITHUB_OUTPUT"
          else
            echo "target=ftp_root" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to matched public_html directory
        if: steps.target.outputs.target == 'public_html'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: public_html/bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md
            data/**
            uploads/**
            storage/**
            publications/**

      - name: Deploy to matched FTP-root directory
        if: steps.target.outputs.target == 'ftp_root'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: 31.170.161.28
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: bienes-raices-vehiculos/
          exclude: |
            .git/**
            .git
            **/.git/**
            **/.git
            **/.github/**
            **/README.md
            data/**
            uploads/**
            storage/**
            publications/**

      - name: Verify published assets over HTTPS
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://lavdigitalmkt.com/bienes-raices-vehiculos"
          for name in index.html public-card-mobile-fix.css sw.js; do
            curl --fail --silent --show-error --max-time 30 -H 'Cache-Control: no-cache' "$BASE/$name?verify=${GITHUB_RUN_ID}" -o "/tmp/live-${name}"
            cmp "$name" "/tmp/live-${name}" || { echo "::error::Live $name differs from GitHub checkout"; exit 1; }
            echo "Verified live $name matches repository"
          done
